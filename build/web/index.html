  <script>
    (function() {
      try {
        var storedId = localStorage.getItem('bishe_umami_website_id');
        var storedHost = localStorage.getItem('bishe_umami_host_url');
        window.umamiConfig = {
          websiteId: storedId || '20261124-0001-4000-8000-000000000001',
          hostUrl: storedHost || 'https://cloud.umami.is',
          autoTrack: true
        };
      } catch (e) {}
    })();

    window.bisheTrackEvent = function(name, data) {
      if (window.umami && typeof window.umami.track === 'function') {
        try { window.umami.track(name, data || {}); } catch (e) {}
      }
    };
    window.bisheTrackView = function(url, title) {
      if (window.umami && typeof window.umami.track === 'function') {
        try {
          window.umami.track(function(props) {
            return Object.assign({}, props, { url: url, title: title || document.title });
          });
        } catch (e) {}
      }
    };
  </script>
  <script defer
          src="umami.js"
          data-website-id="20261124-0001-4000-8000-000000000001"
          data-host-url="https://cloud.umami.is"
          data-auto-track="true">
  </script>

<body>
  <script>
    // 1. Force purge stale Service Workers from browser
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }
    // 2. Force delete all browser CacheStorage buckets
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) { caches.delete(name); }
      });
    }
    // 3. Dynamically inject flutter_bootstrap.js with a timestamp cache-buster to prevent HTTP 304 stale caching
    var bs = document.createElement('script');
    bs.src = 'flutter_bootstrap.js?t=' + Date.now();
    bs.async = true;
    document.body.appendChild(bs);
  </script>
