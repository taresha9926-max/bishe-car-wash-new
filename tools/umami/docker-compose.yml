services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: bishe-umami
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami_bishe_2026@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: d874ff7df45ee8d121242acae5f51a7ec8377a206ec1e63961b3c5e19670f63a
      TWO_FACTOR_ENCRYPTION_KEY: 7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: bishe-umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_bishe_2026
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
